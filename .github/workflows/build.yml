name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Apply patches, build and test
    # Branches of this repository are built on push; pull requests only need their own build when they come from a fork
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # paperweight applies patches with git, which requires an identity.
      # These commits only exist inside the CI workspace and are never pushed.
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Use the commit time as the build time so that the jar manifest is reproducible.
      - name: Set reproducible build time
        run: echo "BUILD_STARTED_AT=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Create Paperclip jar
        run: ./gradlew createPaperclipJar --stacktrace

      # Starts real test servers. The project maintainers accept the Minecraft EULA
      # (https://aka.ms/MinecraftEULA) for these throwaway servers; the script passes -Dcom.mojang.eula.agree=true.
      # The second start covers the case where all configuration files already exist.
      - name: Smoke test (first start)
        env:
          SMOKE_EXPECT_CLEAN_CONFIG: "true"
        run: scripts/smoke-test.sh cubiq-server/build/libs/cubiq-paperclip-*.jar "$RUNNER_TEMP/server"

      - name: Smoke test (second start)
        env:
          SMOKE_EXPECT_CLEAN_CONFIG: "true"
        run: scripts/smoke-test.sh cubiq-server/build/libs/cubiq-paperclip-*.jar "$RUNNER_TEMP/server"

      - name: Upload smoke test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/server/smoke-test.log
            ${{ runner.temp }}/server/logs/
          if-no-files-found: ignore

      - name: Upload server jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cubiq-${{ github.sha }}
          path: cubiq-server/build/libs/cubiq-paperclip-*.jar
          if-no-files-found: error
