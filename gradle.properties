group = studio.cubiq

mcVersion = 26.3
# The API version used in (paper-)plugin.yml files
apiVersion = 26.3
# Release channel of builds produced by CI. Cubiq has not had a stable release yet.
channel = ALPHA
# Version of the next release without its patch number (MAJOR.MINOR). CI releases every build of main that passes all
# checks and numbers the releases of a version by their patch number: 0.0.1, 0.0.2 and so on. See docs/CONTRIBUTING.md.
cubiqVersion = 0.0

# Upstream: Purpur (which itself pins a Paper commit). Update with care, see docs/CONTRIBUTING.md
purpurCommit = 087d0657045e02a81cecd5901008cda81c6f6fd4

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.vfs.watch = false
